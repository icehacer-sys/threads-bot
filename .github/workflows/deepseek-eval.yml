name: deepseek-eval

# Owner-approved DeepSeek trial evaluation. DRY RUN ONLY: nothing is posted, no state is
# committed (read-only token, no git push). Runs the full reply workflow on one recent case
# post with BOT_DEEPSEEK_TRIAL=on, re-drafting comments that were already answered and printing
# the published Claude reply beside each draft. Model spend is capped per run below.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Case post media id or shortcode to evaluate (replay mode)"
        type: string
        required: false
        default: ""
      pre_reveal:
        description: "Simulate the pre-reveal phase (only comments and replies before the answer was pinned)"
        type: choice
        options: ["on", "off"]
        default: "on"
      mode:
        description: "replay = dry-run reply workflow; search-smoke = ONE DeepSeek native web search request"
        type: choice
        options: ["replay", "search-smoke", "learn-dry"]
        default: "replay"
      provider:
        description: "deepseek = production candidate (Claude only for web-search lookups); hybrid = earlier trial routing"
        type: choice
        options: ["deepseek", "hybrid"]
        default: "deepseek"
      deepseek_all:
        description: "Route EVERYTHING to DeepSeek (corrections with search, commenter GIFs/images); replay mode only"
        type: choice
        options: ["off", "on"]
        default: "off"
      smoke_comment:
        description: "search-smoke only: synthetic comment text (blank = default)"
        type: string
        required: false
        default: ""
      usd_cap:
        description: "Combined Claude + DeepSeek estimated spend cap for this run (USD)"
        type: string
        default: "0.15"

permissions:
  contents: read

# Dry runs share no state and post nothing, so evaluations may run in parallel.
concurrency:
  group: deepseek-eval-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: me
      BOT_REPLY_PROVIDER: ${{ github.event.inputs.provider || 'deepseek' }}
      BOT_EVAL_REPLAY: "on"
      BOT_EVAL_PRE_REVEAL: ${{ github.event.inputs.pre_reveal }}
      BOT_EVAL_DEEPSEEK_ALL: ${{ github.event.inputs.deepseek_all }}
      # Same reply settings as the live worker (reply.yml), except scope and budget.
      BOT_EDUCATIONAL: "on"
      BOT_PINNED_POSTS: ""
      BOT_WINDOW_HOURS: "0"
      BOT_MAX_POSTS: "25"
      BOT_VISION: "on"
      BOT_ANSWER: "on"
      BOT_ANSWER_DELAY_HOURS: "1"
      BOT_ANSWER_SPOILER: "on"
      BOT_ACTIVE_TZ: "Africa/Cairo"
      BOT_PER_POST_CAP: "220"
      BOT_DAILY_CAP: "250"
      BOT_VOICE: "lean"
      BOT_REPLY_ALL: "on"
      BOT_MAX_THREAD_REPLIES: "3"
      BOT_DAILY_USD: ${{ github.event.inputs.usd_cap }}
      BOT_ESCALATE_USD: ${{ github.event.inputs.usd_cap }}
      BOT_MEDICAL_RESERVE_USD: "0"
      BOT_RESERVE_MIN_VALUE: "2"
      BOT_ESCALATE_MEDIA: "motion"
      BOT_MODEL: "claude-sonnet-4-6"
      BOT_TRIAGE_MODEL: "claude-haiku-4-5-20251001"
      BOT_ESCALATE: "correct,teach,reference"
      BOT_ANTIREPEAT: "30"
      BOT_WEB_SEARCH: "on"
      BOT_FACEBOOK_REPLY: "off"
      BOT_GIF_REPLIES: "off"
      BOT_PROMO: "on"
      BOT_PROMO_PER_POST: "1"
      BOT_PROMO_PER_DAY: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install comment video frame tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: One-request DeepSeek search smoke (posts nothing)
        if: github.event.inputs.mode == 'search-smoke'
        env:
          SMOKE_COMMENT: ${{ github.event.inputs.smoke_comment }}
        run: npx tsx tools/deepseek-search-smoke.mts
      - name: Weekly voice self-audit on DeepSeek (never committed; read-only token)
        if: github.event.inputs.mode == 'learn-dry'
        env:
          BOT_LEARN_PROVIDER: deepseek
          BOT_LEARN_DAYS: "7"
          BOT_LEARN_MAX_PAIRS: "150"
        run: |
          npm run learn || echo "learner exited non-zero (candidate rejected or error)"
          echo "----- candidate notes -----"; cat data/voice-candidate.md
          echo "----- evaluation -----"; node -e "const e=require('./data/voice-evaluation.json');console.log(JSON.stringify({at:e.at,model:e.model,pairs:e.pairs,stage:e.stage,passed:e.passed,spend:e.spend,results:(e.results||[]).map(r=>({name:r.name,passed:r.passed,decision:r.decision?.decision,category:r.decision?.category,reason:r.decision?.reason,reply:r.decision?.reply_text}))},null,1))"
      - name: Dry-run evaluation (posts nothing)
        if: github.event.inputs.mode == 'replay'
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: npx tsx src/index.ts --dry-run "$TARGET"
