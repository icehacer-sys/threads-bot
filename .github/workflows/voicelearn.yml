name: voice-self-learn

# Once a WEEK, deepseek-flash audits the account's own recent comment->reply pairs (weighting the replies
# that sparked a human reply back) and consolidates a bounded set of "learned voice notes" into
# data/voice-learned.md. reply.ts injects that file into every reply's system prompt, so the voice
# keeps sharpening itself. The file is git-tracked, so every update is a reviewable, revertible
# diff — and it only refines a SEPARATE notes layer, never rewrites the core voice in voice.ts.
#
# Runs Mondays at 09:00 UTC (12 PM Cairo), just after the 11 PM-11 AM Cairo reply window closes, so
# it learns from a full week of engagement in one pass. Changed from daily -> weekly (owner,
# 2026-07-17) to cut API spend: a day of replies rarely moves the notes enough to justify a full
# Fable 5 audit, and a week's worth gives it more signal per run. Trigger manually (Actions -> Run
# workflow) with backfill=true to reseed from ALL past posts.
#
# Provider (owner decision A, 2026-10-17): the audit AND the fixed voice evaluation run on deepseek-flash.
# Claude Haiku 5.5 (BOT_FALLBACK_MODEL) answers a call only when DeepSeek still fails after retries.
#
# Required repository secrets: DEEPSEEK_API_KEY, ANTHROPIC_API_KEY (idle Haiku 5.5 fallback), THREADS_ACCESS_TOKEN

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC (12 PM Cairo)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Seed from ALL past posts (capped) instead of the recent window"
        type: boolean
        default: false

concurrency:
  group: voice-self-learn
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: me
      # The learner drafts the notes on deepseek-flash; the fixed evaluation drafts its synthetic replies through
      # the same deepseek-all reply path the worker uses. ROLLBACK: delete these three lines and the learner
      # returns to BOT_LEARN_MODEL (code default claude-sonnet-5) with Claude evaluation.
      BOT_LEARN_PROVIDER: "deepseek"
      BOT_REPLY_PROVIDER: "deepseek-all"
      BOT_FALLBACK_MODEL: "claude-haiku-5-5"
      BOT_LEARN_DAYS: "7" # matches the weekly cron — at 3 the audit paid for a weekly run but only ever saw 3 of the 7 days
      BOT_LEARN_MAX_PAIRS: "150"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate and evaluate voice candidate
        shell: bash
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then npm run learn:backfill | tee /tmp/learn.log; else npm run learn | tee /tmp/learn.log; fi
      - name: Commit updated voice notes
        run: |
          if [ -n "$(git status --porcelain data/voice-learned.md data/voice-changelog.md data/voice-candidate.md data/voice-evaluation.json)" ]; then
            # The commit message carries the one-line "what changed" summary Fable emitted, so
            # `git log` skims the voice's evolution. voice-changelog.md is the full running log.
            SUMMARY=$(grep -m1 '^CHANGE_SUMMARY:' /tmp/learn.log | sed 's/^CHANGE_SUMMARY:[[:space:]]*//' | cut -c1-140)
            [ -z "$SUMMARY" ] && SUMMARY="update learned notes"
            git config user.name "threads-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/voice-learned.md data/voice-changelog.md data/voice-candidate.md data/voice-evaluation.json
            printf 'chore: voice self-audit: %s [skip ci]\n' "$SUMMARY" > /tmp/msg.txt
            git commit -F /tmp/msg.txt
            synced=false
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null || true; sleep 3; continue; }
              git push && { synced=true; break; } || { echo "push failed ($attempt/3)"; sleep 3; }
            done
            [ "$synced" = true ] || exit 1
          else
            echo "no change to voice notes this run"
          fi
      - name: Preserve failed candidate and evaluation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review
          path: |
            data/voice-candidate.md
            data/voice-evaluation.json
          retention-days: 7
